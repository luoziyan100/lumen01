<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .vibe { font: 500 20px/1.3 'Inter Tight',sans-serif; color: var(--ink); letter-spacing: -.01em; max-width: 520px; }
  .vibe em { font-style: italic; color: var(--ember); font-family: 'Source Serif 4', serif; font-weight: 400; }
  .quote { font: 400 14px/1.6 'Source Serif 4',serif; color: var(--ink-soft); border-left: 2px solid var(--ember); padding: 6px 14px; max-width: 600px; }
  .labels { display:flex; gap:8px; flex-wrap:wrap; }
  .label { font: 500 11px/1 'Inter Tight',sans-serif; letter-spacing: .06em; text-transform: uppercase; padding: 5px 10px; background: var(--paper-deep); color: var(--ink-mute); border-radius: 9999px; border: 1px solid var(--sand); }
</style></head>
<body>
<div class="card">
  <div class="vibe">纸墨书房的安静，<em>工具的克制与精准</em>。</div>
  <div class="quote">"告诉 Lumen 你在研究什么。它会从你的文献库中寻找相关论文，阅读、对比、回答。"</div>
  <div class="labels">
    <span class="label">Quiet</span>
    <span class="label">Warm</span>
    <span class="label">Precise</span>
    <span class="label">Reading-first</span>
    <span class="label">No AI hype</span>
    <span class="label">No emoji</span>
  </div>
</div>
</body></html>
