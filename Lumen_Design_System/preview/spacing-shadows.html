<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .tile { display:flex; flex-direction:column; align-items:center; gap: 10px; padding: 20px 0; }
  .box { width: 110px; height: 68px; background: #fff; border-radius: 8px; }
  .sh-0 { }
  .sh-1 { box-shadow: 0 1px 0 rgba(42,36,30,.06); }
  .sh-2 { box-shadow: 0 2px 8px rgba(42,36,30,.06), 0 1px 2px rgba(42,36,30,.04); }
  .sh-3 { box-shadow: 0 12px 32px rgba(42,36,30,.10), 0 2px 8px rgba(42,36,30,.06); }
  .l { font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft); }
  .m { font-size: 10px; color: var(--ink-mute); }
</style></head>
<body>
<div class="card compact">
  <div class="row">
    <div class="tile"><div class="box sh-0"></div><div class="l">shadow-0</div><div class="m">default</div></div>
    <div class="tile"><div class="box sh-1"></div><div class="l">shadow-1</div><div class="m">card hairline</div></div>
    <div class="tile"><div class="box sh-2"></div><div class="l">shadow-2</div><div class="m">popover</div></div>
    <div class="tile"><div class="box sh-3"></div><div class="l">shadow-3</div><div class="m">modal</div></div>
  </div>
</div>
</body></html>
