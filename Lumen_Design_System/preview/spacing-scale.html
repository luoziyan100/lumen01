<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .row { display:flex; align-items:center; gap: 12px; }
  .bar { height: 16px; background: var(--ember-tint); border-radius: 2px; border: 1px solid var(--ember); border-left-width: 4px; border-right-width: 0; }
  .token { font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft); width: 60px; }
  .px { font-family: var(--font-mono); font-size: 10px; color: var(--ink-mute); width: 40px; text-align: right; }
</style></head>
<body>
<div class="card compact">
  <div class="row"><div class="token">s-1</div><div class="bar" style="width:4px"></div><div class="px">4px</div></div>
  <div class="row"><div class="token">s-2</div><div class="bar" style="width:8px"></div><div class="px">8px</div></div>
  <div class="row"><div class="token">s-3</div><div class="bar" style="width:12px"></div><div class="px">12px</div></div>
  <div class="row"><div class="token">s-4</div><div class="bar" style="width:16px"></div><div class="px">16px</div></div>
  <div class="row"><div class="token">s-5</div><div class="bar" style="width:20px"></div><div class="px">20px</div></div>
  <div class="row"><div class="token">s-6</div><div class="bar" style="width:24px"></div><div class="px">24px</div></div>
  <div class="row"><div class="token">s-8</div><div class="bar" style="width:32px"></div><div class="px">32px</div></div>
  <div class="row"><div class="token">s-10</div><div class="bar" style="width:40px"></div><div class="px">40px</div></div>
  <div class="row"><div class="token">s-12</div><div class="bar" style="width:48px"></div><div class="px">48px</div></div>
  <div class="row"><div class="token">s-16</div><div class="bar" style="width:64px"></div><div class="px">64px</div></div>
</div>
</body></html>
