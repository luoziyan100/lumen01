<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  .tile { display:flex; flex-direction:column; align-items:center; gap: 8px; }
  .box { width: 80px; height: 64px; background: var(--vellum); border: 1px solid var(--sand); }
  .l { font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft); }
  .m { font-size: 10px; color: var(--ink-mute); }
</style></head>
<body>
<div class="card compact">
  <div class="row">
    <div class="tile"><div class="box" style="border-radius:0"></div><div class="l">none</div><div class="m">0 · dividers</div></div>
    <div class="tile"><div class="box" style="border-radius:4px"></div><div class="l">sm · 4</div><div class="m">inputs</div></div>
    <div class="tile"><div class="box" style="border-radius:8px"></div><div class="l">md · 8</div><div class="m">cards</div></div>
    <div class="tile"><div class="box" style="border-radius:12px"></div><div class="l">lg · 12</div><div class="m">modals</div></div>
    <div class="tile"><div class="box" style="border-radius:9999px"></div><div class="l">full</div><div class="m">tags · pills</div></div>
  </div>
</div>
</body></html>
