<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { background: var(--paper); }
  .wrap { display:flex; align-items:center; gap: 48px; padding: 20px 0; justify-content: center; }
  .logo-row { display:flex; flex-direction:column; align-items:center; gap: 10px; }
  .lbl { font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-mute); }
  .dark-bg { background: #2A241E; padding: 24px; border-radius: 8px; }
</style></head>
<body>
<div class="card">
  <div class="wrap">
    <div class="logo-row">
      <img src="../assets/logo/mark.svg" width="56" height="56" alt="mark"/>
      <div class="lbl">Mark · 标志</div>
    </div>
    <div class="logo-row">
      <img src="../assets/logo/wordmark.svg" width="200" alt="wordmark"/>
      <div class="lbl">Wordmark · 字标</div>
    </div>
    <div class="logo-row">
      <div class="dark-bg"><img src="../assets/logo/mark.svg" width="48" height="48" alt="mark-dark"/></div>
      <div class="lbl">On ink · 深底</div>
    </div>
  </div>
</div>
</body></html>
