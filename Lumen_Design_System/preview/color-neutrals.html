<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .swatch { border-radius: 6px; border: 1px solid rgba(42,36,30,.06); height: 72px; position: relative; overflow: hidden; }
  .swatch .label { position: absolute; bottom: 6px; left: 8px; right: 8px; display: flex; justify-content: space-between; align-items: baseline; font-family: var(--font-mono); font-size: 10px; color: var(--ink-soft); }
  .swatch .hex { color: var(--ink-mute); font-size: 10px; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .swatch.dark .label, .swatch.dark .hex { color: rgba(250,247,242,.88); }
</style></head>
<body>
<div class="card">
  <div class="grid">
    <div class="swatch" style="background:#FAF7F2"><div class="label"><span>paper</span><span class="hex">FAF7F2</span></div></div>
    <div class="swatch" style="background:#F6F1E8"><div class="label"><span>paper-deep</span><span class="hex">F6F1E8</span></div></div>
    <div class="swatch" style="background:#F3EDE3"><div class="label"><span>vellum</span><span class="hex">F3EDE3</span></div></div>
    <div class="swatch" style="background:#E8DFD1"><div class="label"><span>sand</span><span class="hex">E8DFD1</span></div></div>
    <div class="swatch" style="background:#D9CEBB"><div class="label"><span>sand-deep</span><span class="hex">D9CEBB</span></div></div>
    <div class="swatch dark" style="background:#B5ABA0"><div class="label"><span>ink-faint</span><span class="hex">B5ABA0</span></div></div>
    <div class="swatch dark" style="background:#8C8278"><div class="label"><span>ink-mute</span><span class="hex">8C8278</span></div></div>
    <div class="swatch dark" style="background:#5A524A"><div class="label"><span>ink-soft</span><span class="hex">5A524A</span></div></div>
    <div class="swatch dark" style="background:#2A241E"><div class="label"><span>ink</span><span class="hex">2A241E</span></div></div>
    <div class="swatch" style="background:#FAF7F2;border:1px dashed #E8DFD1"><div class="label" style="color:#8C8278"><span>— surface</span></div></div>
  </div>
</div>
</body></html>
