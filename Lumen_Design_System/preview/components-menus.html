<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .menu { background: var(--paper); border: 1px solid var(--sand); border-radius: 8px; padding: 6px; box-shadow: 0 12px 32px rgba(42,36,30,.1), 0 2px 8px rgba(42,36,30,.06); width: 240px; }
  .mi { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 4px; font: 400 13px/1 'Inter Tight',sans-serif; color: var(--ink); cursor: pointer; }
  .mi:hover, .mi.active { background: var(--sand); }
  .mi .ico { width: 15px; height: 15px; color: var(--ink-mute); flex-shrink: 0; }
  .mi .kbd { margin-left: auto; font: 500 11px/1 var(--font-mono); color: var(--ink-mute); }
  .sep { height: 1px; background: var(--sand); margin: 6px -2px; }
  .danger-item { color: var(--danger); }
  .danger-item .ico { color: var(--danger); }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
  .ctx-label { font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-mute); margin-bottom: 8px; }
</style></head>
<body>
<div class="card compact">
  <div class="cols">
    <div>
      <div class="ctx-label">右键菜单 · Context menu</div>
      <div class="menu">
        <div class="mi"><svg class="ico" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M15 3h6v6M10 14 21 3M21 14v7H3V3h7"/></svg>在新标签打开<span class="kbd">⌘O</span></div>
        <div class="mi active"><svg class="ico" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/></svg>归档到…<span class="kbd">⌘S</span></div>
        <div class="mi"><svg class="ico" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M12 2v4M12 18v4M2 12h4M18 12h4M4.9 4.9l2.8 2.8M16.2 16.2l2.8 2.8M4.9 19.1l2.8-2.8M16.2 7.8l2.8-2.8"/></svg>深度研究<span class="kbd">⌘R</span></div>
        <div class="sep"></div>
        <div class="mi"><svg class="ico" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M8 4v16l8-8Z"/></svg>复制引用</div>
        <div class="sep"></div>
        <div class="mi danger-item"><svg class="ico" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6v14h12V6"/></svg>删除</div>
      </div>
    </div>
    <div>
      <div class="ctx-label">Toast · 轻提示</div>
      <div style="display:flex;flex-direction:column;gap:10px">
        <div style="background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:8px;display:flex;align-items:center;gap:12px;font-size:13px;box-shadow:0 12px 32px rgba(42,36,30,.18)">
          <span style="flex:1">已归档到 "注意力机制 · 2024"</span>
          <span style="color:var(--ember-soft);font-weight:500;cursor:pointer">撤销</span>
        </div>
        <div style="background:var(--vellum);border:1px solid var(--sand);padding:10px 14px;border-radius:8px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-soft)">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"><animate attributeName="opacity" values="1;.3;1" dur="1.2s" repeatCount="indefinite"/></circle></svg>
          正在阅读全文 · 约 40 秒
        </div>
      </div>
    </div>
  </div>
</div>
</body></html>
